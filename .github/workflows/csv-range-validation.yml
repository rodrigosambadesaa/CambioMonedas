name: C strict CSV range property tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile sanitized CSV handler
        run: |
          make debug CFLAGS='-std=c2x -g -O1 -Wall -Wextra -Wpedantic -fsanitize=address,undefined,leak -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined,leak'
      - name: Test stream and batch valid and invalid ranges
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tests/test_csv_range_validation.py
