name: Stock JSON contract (C)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-json:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile C (Unix)
        if: runner.os != 'Windows'
        run: make release
      - name: Compile C (Windows)
        if: runner.os == 'Windows'
        run: gcc -std=c2x -O2 main.c app_console.c server_http.c vector_dinamico.c moneda_gestion.c bigint.c algoritmo_cambio.c csv_io.c logger.c json_io.c batch_cli.c exchange_api.c gui_launcher.c progvoraz_locale.c -o progvoraz.exe
      - name: Validate exported JSON (Unix)
        if: runner.os != 'Windows'
        run: python tests/test_stock_json_contract.py ./progvoraz
      - name: Validate exported JSON (Windows)
        if: runner.os == 'Windows'
        run: python tests/test_stock_json_contract.py .\\progvoraz.exe
      - name: Validate deterministic conversion (Unix)
        if: runner.os != 'Windows'
        run: python tests/test_exchange_stub.py ./progvoraz
      - name: Validate deterministic conversion (Windows)
        if: runner.os == 'Windows'
        run: python tests/test_exchange_stub.py .\\progvoraz.exe
