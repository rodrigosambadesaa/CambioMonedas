services:
  progvoraz-console:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: progvoraz:latest
    pull_policy: build
    volumes:
      # Mount a DIRECTORY, not individual stock.txt: atomic rename on a
      # file bind mount fails with EBUSY and cannot be made safe by fallback.
      - ./:/app/workspace
    stdin_open: true
    tty: true
    command: [ "console" ]

  progvoraz-gui-portable:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: progvoraz:latest
    pull_policy: build
    volumes:
      # Mount a DIRECTORY, not individual stock.txt: atomic rename on a
      # file bind mount fails with EBUSY and cannot be made safe by fallback.
      - ./:/app/workspace
    stdin_open: true
    tty: true
    command: [ "gui" ]

  progvoraz-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: quality
    image: progvoraz-quality:latest
    pull_policy: build
    # Isolated disposable test data; never change the host's stock.txt.
    command: [ "test" ]
